<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Điều khiển xe</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        background-color: #f0f0f0;
      }

      .container {
        background: white;
        padding: 24px;
        border-radius: 10px;
        box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
        max-width: 1200px;
        width: 100%;
      }

      h1 {
        margin-top: 0;
        margin-bottom: 12px;
        text-align: center;
      }

      .main-layout {
        display: flex;
        gap: 20px;
        align-items: flex-start;
      }

      .left-panel {
        flex: 2;
      }

      .right-panel {
        flex: 1.2;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .panel-box {
        background: #fafafa;
        border-radius: 8px;
        border: 1px solid #ddd;
        padding: 10px 12px;
      }

      .panel-box h2 {
        margin: 0 0 8px 0;
        font-size: 16px;
      }

      .panel-box h3 {
        margin: 8px 0 4px 0;
        font-size: 14px;
      }

      .camera-view {
        margin-top: 4px;
      }

      #camera-stream {
        width: 100%;
        max-width: 640px;
        height: auto;
        border: 2px solid #ddd;
        border-radius: 5px;
        display: block;
      }

      .controls {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        margin: 10px auto 10px;
        width: 100%;
      }

      button {
        padding: 12px;
        font-size: 16px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        background-color: #4caf50;
        color: white;
        transition: all 0.2s;
      }

      button:hover {
        background-color: #45a049;
        transform: scale(1.03);
      }

      button:active {
        transform: scale(0.96);
      }

      .stop {
        background-color: #f44336;
      }

      .stop:hover {
        background-color: #da190b;
      }

      .empty {
        visibility: hidden;
      }

      .speed-control {
        margin: 8px 0 6px;
        font-size: 14px;
      }

      input[type="range"] {
        width: 100%;
      }

      .status {
        margin-top: 6px;
        padding: 6px 8px;
        font-size: 13px;
        background-color: #e7f3ff;
        border-radius: 5px;
      }

      #analysis-status {
        background-color: #fffbe7;
      }

      .log-row {
        font-size: 13px;
        margin-bottom: 4px;
      }

      .lane-log-container {
        margin-top: 8px;
        max-height: 180px; /* chiều cao cố định cho vùng log */
        overflow-y: auto; /* scroll dọc khi dài quá */
        background: #ffffff;
        border-radius: 4px;
        border: 1px solid #eee;
        padding: 6px 8px;
      }

      .lane-log-line {
        font-size: 12px;
        color: #333;
        margin-bottom: 2px;
        white-space: nowrap;
      }

      .log-label {
        font-weight: bold;
      }

      .log-small {
        font-size: 12px;
        color: #555;
      }

      #sign-list {
        margin: 4px 0 0 16px;
        padding: 0;
        font-size: 13px;
      }

      #sign-list li {
        margin-bottom: 2px;
      }

      @media (max-width: 900px) {
        .main-layout {
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Điều khiển xe</h1>

      <div class="main-layout">
        <!-- BÊN TRÁI: FRAME -->
        <div class="left-panel">
          <div class="camera-view">
            <h2>Camera / Lane view</h2>
            <img
              id="camera-stream"
              src="/api/stream-live-feed/"
              alt="Camera stream"
            />
          </div>
        </div>

        <!-- BÊN PHẢI: LOG + ĐIỀU KHIỂN -->
        <div class="right-panel">
          <!-- BOX 1: LOG LANE + SIGN -->
          <div class="panel-box">
            <h2>Log điều khiển & biển báo</h2>

            <h3>Lane / Command</h3>
            <div class="log-row">
              <span class="log-label">CMD:</span>
              <span id="lane-command">--</span>
            </div>
            <div class="log-row">
              <span class="log-label">Action:</span>
              <span id="lane-action">--</span>
            </div>
            <div class="log-row">
              <span class="log-label">Steering:</span>
              <span id="lane-score">--</span>
            </div>
            <div class="log-row">
              <span class="log-label">Offset:</span>
              <span id="lane-offset">--</span>
            </div>
            <div class="log-row">
              <span class="log-label">Góc làn:</span>
              <span id="lane-angle">--</span>
            </div>
            <div class="log-row">
              <span class="log-label">Confidence:</span>
              <span id="lane-confidence">--</span>
            </div>
            <div class="log-row">
              <span class="log-label">Cảnh báo:</span>
              <span id="lane-warning">--</span>
            </div>
            <div class="log-small" id="lane-state">
              STATE: -- | FPS: -- | Frames: --
            </div>
            <div class="log-small">
              Biển báo (CarControl): <span id="lane-sign-from-control">--</span>
            </div>

            <h3>Lịch sử lệnh (phiên hiện tại)</h3>
            <div class="lane-log-container" id="lane-log-container">
              <div id="lane-log-history"></div>
            </div>

            <hr />
          </div>

          <!-- BOX 2: ĐIỀU KHIỂN -->
          <div class="panel-box">
            <h2>Điều khiển</h2>

            <div class="controls">
              <button class="empty"></button>
              <button onclick="sendCommand('forward')">⬆️ Tiến</button>
              <button class="empty"></button>

              <button onclick="sendCommand('left')">⬅️ Trái</button>
              <button class="stop" onclick="sendCommand('stop')">
                ⏹️ Dừng
              </button>
              <button onclick="sendCommand('right')">➡️ Phải</button>

              <button class="empty"></button>
              <button onclick="sendCommand('backward')">⬇️ Lùi</button>
              <button class="empty"></button>
            </div>

            <div class="speed-control">
              <label for="speed">Tốc độ: <span id="speedValue">90</span></label
              ><br />
              <input
                type="range"
                id="speed"
                min="0"
                max="255"
                value="90"
                oninput="updateSpeed(this.value)"
              />
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      let currentSpeed = 90;

      function updateSpeed(value) {
        currentSpeed = parseInt(value);
        document.getElementById("speedValue").textContent = currentSpeed;
      }

      async function sendCommand(command) {
        try {
          const response = await fetch("/api/set-command/", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              command: command,
              speed: currentSpeed,
            }),
          });

          const data = await response.json();

          if (data.status === "success") {
            document.getElementById(
              "status"
            ).textContent = `Trạng thái: ${command.toUpperCase()} - Tốc độ: ${currentSpeed}`;
          }
        } catch (error) {
          console.error("Error:", error);
          document.getElementById("status").textContent =
            "Lỗi: Không thể gửi lệnh";
        }
      }

      // Gọi YOLO trên frame hiện tại
      async function runAnalyzeOnce() {
        try {
          const res = await fetch("/api/analyze-stream/");
          await res.json(); // kết quả sẽ được lưu vào last_analysis_result
        } catch (e) {
          console.error("analyze-stream error", e);
        }
      }

      function resetLaneLog() {
        const historyEl = document.getElementById("lane-log-history");
        if (historyEl) {
          historyEl.innerHTML = "";
        }
      }

      // ➕ Thêm một dòng mới vào lịch sử log
      function appendLaneLog(data) {
        const historyEl = document.getElementById("lane-log-history");
        const container = document.getElementById("lane-log-container");
        if (!historyEl || !container) return;

        const info = data.info || {};
        const raw = info.raw_data || {};
        const laneSt = info.lane_status || {};

        const now = new Date();
        const timeStr = now.toLocaleTimeString("vi-VN");

        const cmd = (data.command || "--").toUpperCase();
        const action = info.action || "--";
        const steering =
          info.steering_score != null ? info.steering_score.toFixed(2) : "--";
        const offset = raw.offset_m != null ? raw.offset_m.toFixed(2) : "--";
        const angle = raw.lane_angle != null ? raw.lane_angle.toFixed(1) : "--";
        const warn = laneSt.warning || info.warning || "";

        const line = document.createElement("div");
        line.className = "lane-log-line";
        line.textContent =
          `[${timeStr}] CMD=${cmd}` +
          ` | act=${action}` +
          ` | steer=${steering}` +
          ` | off=${offset}` +
          ` | angle=${angle}` +
          (warn ? ` | warn=${warn}` : "");

        historyEl.appendChild(line);

        // Giới hạn số dòng (ví dụ 200 dòng gần nhất)
        if (historyEl.children.length > 200) {
          historyEl.removeChild(historyEl.firstChild);
        }

        // Auto scroll xuống cuối
        container.scrollTop = container.scrollHeight;
      }

      // Lấy info điều khiển từ CarControl (command detect làn, offset, góc, ...)
      async function fetchControlInfo() {
        try {
          const res = await fetch("/api/control-info/");
          if (!res.ok) {
            throw new Error("HTTP " + res.status);
          }
          const data = await res.json();

          // command + state
          document.getElementById("lane-command").textContent = `${(
            data.command || "--"
          ).toUpperCase()} @ ${data.speed ?? 0}`;
          document.getElementById("lane-state").textContent = `STATE: ${(
            data.state || "--"
          ).toUpperCase()} | FPS: ${data.fps ?? "--"} | Frames: ${
            data.frame_count ?? "--"
          }`;

          const info = data.info || {};
          const raw = info.raw_data || {};
          const laneSt = info.lane_status || {};

          document.getElementById("lane-action").textContent =
            info.action || "--";

          const steering =
            info.steering_score !== undefined && info.steering_score !== null
              ? info.steering_score.toFixed(2)
              : "--";
          document.getElementById("lane-score").textContent = steering;

          const offset =
            raw.offset_m !== undefined && raw.offset_m !== null
              ? raw.offset_m.toFixed(2) + " m"
              : "--";
          document.getElementById("lane-offset").textContent = offset;

          const angle =
            raw.lane_angle !== undefined && raw.lane_angle !== null
              ? raw.lane_angle.toFixed(1) + "°"
              : "--";
          document.getElementById("lane-angle").textContent = angle;

          const conf =
            laneSt.confidence !== undefined && laneSt.confidence !== null
              ? Math.round(laneSt.confidence * 100) + "%"
              : "--";
          document.getElementById("lane-confidence").textContent = conf;

          const warning = laneSt.warning || info.warning || "--";
          document.getElementById("lane-warning").textContent = warning;

          const signFromControl = data.current_sign || "Không có";
          document.getElementById("lane-sign-from-control").textContent =
            signFromControl;

          const state = (data.state || "").toLowerCase();
          if (state === "running") {
            appendLaneLog(data);
          }
        } catch (e) {
          console.error("fetchControlInfo error:", e);
        }
      }

      // Điều khiển bằng bàn phím: WASD + Space
      document.addEventListener("keydown", (event) => {
        switch (event.key) {
          case "w":
          case "W":
            sendCommand("forward");
            break;
          case "s":
          case "S":
            sendCommand("backward");
            break;
          case "a":
          case "A":
            sendCommand("left");
            break;
          case "d":
          case "D":
            sendCommand("right");
            break;
          case " ":
            sendCommand("stop");
            break;
        }
      });

      // Lần đầu vào trang: reset log + chạy YOLO 1 lần
      resetLaneLog();
      runAnalyzeOnce();

      // Gọi YOLO định kỳ để luôn cập nhật last_analysis_result
      setInterval(runAnalyzeOnce, 1500);

      // Poll liên tục log lane + kết quả YOLO
      setInterval(() => {
        fetchControlInfo();
        fetchAnalysisResult();
      }, 1000);
    </script>
  </body>
</html>
