<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Điều khiển xe</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .controls {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            gap: 10px;
            margin: 20px auto;
            width: fit-content;
        }

        button {
            padding: 20px;
            font-size: 18px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            background-color: #4CAF50;
            color: white;
            transition: all 0.3s;
        }

        button:hover {
            background-color: #45a049;
            transform: scale(1.05);
        }

        button:active {
            transform: scale(0.95);
        }

        .stop {
            background-color: #f44336;
        }

        .stop:hover {
            background-color: #da190b;
        }

        .empty {
            visibility: hidden;
        }

        .speed-control {
            margin: 20px 0;
        }

        input[type="range"] {
            width: 200px;
        }

        .status {
            margin-top: 20px;
            padding: 10px;
            background-color: #e7f3ff;
            border-radius: 5px;
        }

        .camera-view {
            margin-top: 20px;
        }

        #camera-stream {
            width: 100%;
            max-width: 640px;
            height: auto;
            border: 2px solid #ddd;
            border-radius: 5px;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Điều khiển xe Robot</h1>
    <div class="camera-view">
        <h2>Camera View</h2>
{#        <img id="camera-stream" src="http://192.168.1.18/stream" alt="Camera stream">#}
    </div>

    <div class="controls">
        <button class="empty"></button>
        <button onclick="sendCommand('forward')">⬆️ Tiến</button>
        <button class="empty"></button>

        <button onclick="sendCommand('left')">⬅️ Trái</button>
        <button class="stop" onclick="sendCommand('stop')">⏹️ Dừng</button>
        <button onclick="sendCommand('right')">➡️ Phải</button>

        <button class="empty"></button>
        <button onclick="sendCommand('backward')">⬇️ Lùi</button>
        <button class="empty"></button>
        
        <button style="background-color: #008CBA;" onclick="runAnalysisTest()">🔬 Test</button>

    </div>

    <div class="speed-control">
        <label for="speed">Tốc độ: <span id="speedValue">150</span></label><br>
        <input type="range" id="speed" min="0" max="255" value="150"
               oninput="updateSpeed(this.value)">
    </div>

    <div class="status" id="status">
        Trạng thái: Đang chờ lệnh...
    </div>

    <div class="status" id="analysis-status" style="background-color: #fffbe7; margin-top: 10px;">
        Phân tích: Đang chờ...
    </div>
</div>

<script>
    let currentSpeed = 150;

    function updateSpeed(value) {
        currentSpeed = parseInt(value);
        document.getElementById('speedValue').textContent = currentSpeed;
    }

    async function sendCommand(command) {
        try {
            const response = await fetch('/api/set-command/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    command: command,
                    speed: currentSpeed
                })
            });

            const data = await response.json();

            if (data.status === 'success') {
                document.getElementById('status').textContent =
                    `Trạng thái: ${command.toUpperCase()} - Tốc độ: ${currentSpeed}`;
            }
        } catch (error) {
            console.error('Error:', error);
            document.getElementById('status').textContent =
                'Lỗi: Không thể gửi lệnh';
        }
    }

    async function runAnalysisTest() {
        const analysisDiv = document.getElementById('analysis-status');
        analysisDiv.textContent = "Đang test, vui lòng chờ 2-3s...";
        analysisDiv.style.backgroundColor = "#ffeb3b"; // Màu vàng đậm

        try {
            const response = await fetch('/api/analyze-stream/');

            console.log("Đã gửi yêu cầu test phân tích.");

        } catch (error) {
            console.error('Lỗi khi test phân tích:', error);
            analysisDiv.textContent = 'Lỗi: Không thể chạy test.';
        }
    }

    // Điều khiển bằng bàn phím
    document.addEventListener('keydown', (event) => {
        switch (event.key) {
            {#case 'ArrowUp':#}
            case 'w':
            case 'W':
                sendCommand('forward');
                break;
            {#case 'ArrowDown':#}
            case 's':
            case 'S':
                sendCommand('backward');
                break;
            {#case 'ArrowLeft':#}
            case 'a':
            case 'A':
                sendCommand('left');
                break;
            {#case 'ArrowRight':#}
            case 'd':
            case 'D':
                sendCommand('right');
                break;
            case ' ':
                sendCommand('stop');
                break;
        }
    });
    const esp32IP = prompt("Nhập IP của ESP32-CAM:");
    if (esp32IP) {
        document.getElementById('camera-stream').src = esp32IP;
    }

    function updateAnalysisDisplay(data) {
        const analysisDiv = document.getElementById('analysis-status');

        if (data.status === 'success' && data.detections.length > 0) {
            let firstSign = data.detections[0];
            let confidencePercent = (firstSign.do_tin_cay * 100).toFixed(0);

            analysisDiv.textContent = 
                `Phát hiện: ${firstSign.bien_bao} (${confidencePercent}%)`;
            analysisDiv.style.backgroundColor = "#dcedc8"; 

        } else if (data.status === 'no_detection') {
            analysisDiv.textContent = "Phân tích: Không thấy biển báo.";
            analysisDiv.style.backgroundColor = "#fffbe7"; 

        } else if (data.status === 'error') {
            analysisDiv.textContent = "Lỗi phân tích: " + data.error_msg;
            analysisDiv.style.backgroundColor = "#ffcdd2"; 
        }
    }

    async function fetchAnalysisResult() {
        try {
            const response = await fetch('/api/get-analysis/');
            const data = await response.json();
            updateAnalysisDisplay(data);

        } catch (error) {
            console.error('Lỗi khi lấy kết quả phân tích:', error);
            document.getElementById('analysis-status').textContent = 'Lỗi kết nối phân tích.';
        }
    }

    setInterval(fetchAnalysisResult, 1000);
</script>
</body>
</html>
